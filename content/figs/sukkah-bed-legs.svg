  <g class="lb">
    <text x="2" y="33" class="sm l" data-seg="21b.10">סכך</text>
    <text x="2" y="51" class="sm l" data-seg="21b.10">כרעי המטה</text>
    <text x="2" y="74" class="sm l" data-seg="21b.10">מטה</text>
    <text x="2" y="128" class="sm l" data-seg="21b.12">סכך</text>
    <text x="2" y="157" class="sm l" data-seg="21b.12">שפודין</text>
