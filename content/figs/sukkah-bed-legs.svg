    <text x="2" y="266" class="sm l" data-seg="21b.13">יתידות</text>
    <text x="2" y="284" class="sm l" data-seg="21b.13">מטה</text>
    <text x="352" y="18" data-seg="21b.10">הסומך סוכתו בכרעי המטה</text>
    <text x="352" y="36" class="ok" data-seg="21b.10">התנא הראשון: כשרה</text>
    <text x="352" y="54" class="no" data-seg="21b.10">ר׳ יהודה: פסולה</text>
    <text x="352" y="68" class="sm" data-seg="21b.10">אם אינה יכולה לעמוד בפני עצמה</text>
    <text x="352" y="85" class="sm" data-seg="21b.11">חד אמר: אין לה קבע</text>
    <text x="352" y="99" class="sm" data-seg="21b.11">וחד: מעמידה בדבר המקבל טומאה</text>
    <text x="352" y="126" data-seg="21b.12">נעץ שפודין של ברזל וסיכך</text>
    <text x="352" y="144" class="ok" data-seg="21b.12">למאן דאמר אין לה קבע: כשרה</text>
    <text x="352" y="158" class="sm" data-seg="21b.12">הרי יש לה קבע</text>
    <text x="352" y="176" class="no" data-seg="21b.12">למאן דאמר המקבל טומאה: פסולה</text>
    <text x="352" y="190" class="sm" data-seg="21b.12">הברזל מקבל טומאה</text>
    <text x="352" y="218" data-seg="21b.13">אביי: סיכך על גב המטה</text>
    <text x="352" y="233" class="sm" data-seg="21b.13">המטות דפנות, הסכך על יתידות (רש״י)</text>
    <text x="352" y="252" class="ok" data-seg="21b.13">אביי: כשרה לשני הטעמים</text>
    <text x="352" y="268" class="sm" data-seg="21b.13">הרי יש לה קבע</text>
    <text x="352" y="284" class="sm" data-seg="21b.13">ואין מעמידה בדבר המקבל טומאה</text>
