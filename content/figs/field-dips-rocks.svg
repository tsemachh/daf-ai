<svg viewBox="0 0 360 262" role="img" aria-label="חתך מהצד של שדה: סלע גבוה ונקע עמוק עשרה טפחים אינם נמדדים עם השדה, סלע ונקע קטנים מהם נמדדים עמה">
  <!-- soil of the field (side cross-section), with a small dip (left) and a 10-tefach dip (centre) -->
  <path d="M10,140 H20 L26,158 H44 L50,140 H130 L136,190 H204 L210,140 H350 V215 H10 Z" style="fill:#c9a878;stroke:#8a6a4a;stroke-width:1.5"/>
  <path d="M136,190 H204" style="stroke:#8a6a4a;stroke-width:1.5"/>
  <!-- rocks standing on the field -->
  <path d="M75,140 L80,125 L88,122 L95,125 L100,140 Z" style="fill:#9c978e;stroke:#5f5a52;stroke-width:1.5"/>
  <path d="M230,140 L238,92 L255,90 L272,92 L280,140 Z" style="fill:#9c978e;stroke:#5f5a52;stroke-width:1.5"/>
