<g class="lb">
<text x="270" y="122" class="no" style="text-anchor:middle" data-seg="44b.18">מקיש בקרסוליו ובארכבותיו</text>
<text x="270" y="136" class="sm" style="text-anchor:middle" data-seg="44b.18">נוקשים זה בזה כשהוא הולך</text>
<text x="90" y="122" class="no" style="text-anchor:middle" data-seg="45a.1">העיקל — מקיף פרסותיו</text>
<text x="90" y="136" class="sm" style="text-anchor:middle" data-seg="45a.1">ואין ארכבותיו נוקשות זו לזו</text>
<text x="90" y="150" class="sm" style="text-anchor:middle" data-seg="45a.1">רגליו מעוקלות החוצה</text>
<text x="300" y="240" class="no" style="text-anchor:middle" data-seg="45a.1">עקיבו יוצא לאחוריו</text>
<text x="300" y="254" class="sm" style="text-anchor:middle" data-seg="45a.5">ר׳ אלעזר: שוקו יוצא</text>
<text x="300" y="267" class="sm" style="text-anchor:middle" data-seg="45a.5">באמצע רגלו</text>
<text x="180" y="240" class="no" style="text-anchor:middle" data-seg="45a.1">פרסותיו רחבות כשל אווז</text>
<text x="180" y="254" class="sm" style="text-anchor:middle" data-seg="45a.5">רב פפא: כיון שהיא שטוחה</text>
<text x="180" y="267" class="sm" style="text-anchor:middle" data-seg="45a.5">מאוד — מום, אף אם סדוקה</text>
<text x="60" y="240" class="no" style="text-anchor:middle" data-seg="45a.1">פיקה יוצא מגודלו</text>
</g>
</svg>
