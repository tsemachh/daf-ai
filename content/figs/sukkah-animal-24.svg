  <g class="lb">
    <text x="350" y="16" data-seg="24a.10">רב אחא בר יעקב — ר׳ מאיר סבר:</text>
    <text x="350" y="32" class="sm" data-seg="24a.10">א. כל מחיצה שעומדת ברוח — אינה מחיצה</text>
    <text x="350" y="46" class="sm" data-seg="24a.10">ב. שאינה עשויה בידי אדם — אינה מחיצה</text>
    <text x="219" y="124" class="sm" data-seg="24a.11">דופן</text>
    <text x="8" y="220" class="no l" data-seg="24a.10">בהמה — רוח חיים</text>
    <text x="8" y="234" class="sm l" data-seg="24a.10">עומדת ברוח, ולאו בידי אדם</text>
